<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三才纹 · 流年长卷</title>
<style>
:root{--paper:#f4eedf;--paper2:#fbf7ed;--ink:#211e1a;--red:#9d3030;--blue:#56707b;--muted:#8b8274}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#d8cdb8;color:var(--ink);font-family:Georgia,"Noto Serif SC",serif}main{width:min(980px,calc(100% - 28px));margin:36px auto 60px}.title{text-align:center;letter-spacing:.42em;color:var(--blue);font-size:12px}.intro{text-align:center;margin:18px 0 30px}.intro h1{font-size:clamp(34px,8vw,64px);font-weight:500;margin:0;color:var(--red)}.intro p{color:#726957}.panel{background:var(--paper);padding:28px;border:1px solid #b7a98e;box-shadow:8px 10px 0 rgba(77,56,31,.12);position:relative}.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(157,48,48,.25);pointer-events:none}.upload{text-align:center;position:relative;z-index:1}.drop{display:block;padding:25px;border:1px dashed var(--red);color:#726957;cursor:pointer}.drop input{display:none}.preview{max-width:100%;max-height:350px;margin:18px auto;display:block}.btn{background:var(--red);color:#fff;border:0;padding:11px 26px;font-family:inherit;cursor:pointer}.btn:disabled{opacity:.45}.btn.loading:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{color:#726957;min-height:22px}.error{color:var(--red);min-height:22px}.report{margin-top:26px}.seal{width:min(90%,620px);margin:0 auto 22px;text-align:center;color:var(--red);border:3px double var(--red);padding:18px;box-shadow:4px 4px 0 var(--red)}.seal h2{margin:0;font-size:clamp(28px,6vw,52px);font-weight:500}.seal small{letter-spacing:.4em}.switch{display:flex;width:max-content;margin:0 auto 34px;border:1px solid rgba(157,48,48,.4);padding:4px;background:var(--paper2)}.switch button{border:0;padding:8px 16px;background:transparent;color:var(--blue);font-family:inherit;cursor:pointer}.switch button.active{background:var(--red);color:#fff}.switch button.modern.active{background:var(--blue)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.card{grid-column:span 2;background:var(--paper2);border:1px solid rgba(47,41,34,.25);padding:20px;box-shadow:inset 0 0 35px rgba(80,60,35,.07)}.card:nth-child(4){grid-column:2 / span 2}.card:nth-child(5){grid-column:4 / span 2}.card h3{color:var(--red);font-weight:500}.card p,.timeline p{line-height:2;color:#39332b}.timeline{margin-top:48px}.timeline>h3{text-align:center;color:var(--red);font-size:24px;font-weight:500}.axis{border-left:2px solid rgba(157,48,48,.5);margin-left:13px;padding-left:26px}.stage{position:relative;margin:26px 0}.stage:before{content:"";position:absolute;left:-35px;top:12px;width:14px;height:14px;border-radius:50%;border:4px solid var(--paper);background:var(--red)}.stage-panel{background:var(--paper2);border:1px solid rgba(47,41,34,.22);padding:17px}.stage h4{margin:0;color:var(--red);font-weight:500;font-size:18px}.trace{margin-top:28px;border-left:2px solid var(--red);padding-left:16px;color:#655d51;line-height:2}.trace summary{cursor:pointer;color:var(--blue)}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:30px}@media(max-width:700px){.cards{grid-template-columns:1fr}.card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}.panel{padding:20px}}
</style></head><body><main><div class="title">观掌 · 观势 · 观心</div><header class="intro"><h1>流年长卷</h1><p>以掌中纹理，寻五纹相理与岁时起承</p></header><section class="panel"><div class="upload"><label class="drop">请将掌心照片置于此处<br><small>支持 JPG / PNG，建议自然光、掌面完整</small><input id="file" type="file" accept="image/jpeg,image/png"></label><img id="preview" class="preview" hidden><button id="go" class="btn" disabled>开卷观相</button><p id="status" class="status"></p><p id="error" class="error" role="alert"></p></div><section id="report" class="report" hidden></section></section></main>
<script>
const f=document.querySelector('#file'),p=document.querySelector('#preview'),b=document.querySelector('#go'),s=document.querySelector('#status'),e=document.querySelector('#error'),r=document.querySelector('#report');let file,languageMode='classical',lastResult=null;
f.onchange=()=>{file=f.files[0];if(!file)return;p.src=URL.createObjectURL(file);p.hidden=false;b.disabled=false;e.textContent='';r.hidden=true;r.innerHTML=''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function complete(j){return Boolean(j?.master_pan_ci&&j?.observations&&j?.analysis?.classical&&j?.analysis?.modern&&j?.timeline?.early_years&&j?.timeline?.middle_years&&j?.timeline?.later_years)}
function render(j){if(!complete(j))throw new Error('后端返回字段不完整');lastResult=j;const a=j?.analysis?.[languageMode]||{},o=j?.observations||{},t=j?.timeline||{};const card=(title,text)=>'<article class="card"><h3>'+title+'</h3><p>'+esc(text||'暂无释义')+'</p></article>';r.innerHTML='<div class="seal"><h2>'+esc(j?.master_pan_ci||'厚积成势，静守花开')+'</h2><small>五纹与流年批语</small></div><div class="switch"><button class="'+(languageMode==='classical'?'active':'')+'" data-lang="classical">文言相理</button><button class="modern '+(languageMode==='modern'?'active':'')+'" data-lang="modern">白话疗愈</button></div><div class="cards">'+card('根基 · 地纹',a?.foundation)+card('心智 · 人纹',a?.wisdom)+card('因缘 · 天纹',a?.karma)+card('基业 · 玉柱纹',a?.career)+card('姻缘 · 家风纹',a?.marriage)+'</div><div class="timeline"><h3>流年推演 · 命轨时间轴</h3><div class="axis">'+[['early_years',t?.early_years],['middle_years',t?.middle_years],['later_years',t?.later_years]].map(([key,stage])=>'<article class="stage"><div class="stage-panel"><h4>'+esc(stage?.title||'流年一章')+'</h4><p>'+esc(stage?.[languageMode]||'暂无推演')+'</p></div></article>').join('')+'</div></div><details class="trace"><summary>观相明细 · 探源相理依据</summary><p><b>地纹：</b>'+esc(o?.earth||'暂无观测')+'</p><p><b>人纹：</b>'+esc(o?.human||'暂无观测')+'</p><p><b>天纹：</b>'+esc(o?.heaven||'暂无观测')+'</p><p><b>玉柱纹：</b>'+esc(o?.jade||'暂无观测')+'</p><p><b>家风纹：</b>'+esc(o?.family||'暂无观测')+'</p></details><p class="note">'+esc(j?.disclaimer||'本卷轴由 AI 结合传统易理相学生成，仅供国学文化交流与雅玩，不作现代医学或人生决策之用。')+'</p>';r.hidden=false;r.querySelectorAll('[data-lang]').forEach(x=>x.onclick=()=>{languageMode=x.dataset.lang;render(lastResult)})}
async function requestAnalysis(selectedFile){const fd=new FormData();fd.append('image',selectedFile);const response=await fetch('/api/v1/palmistry/analyze',{method:'POST',body:fd});const raw=await response.text();let responseData;try{responseData=raw?JSON.parse(raw):{}}catch{responseData=raw}console.log('后端返回的原始数据:',responseData);if(!response.ok)throw new Error(responseData?.detail?.error?.message||responseData?.error?.message||'天机受阻，请稍后再试');return responseData}
b.onclick=async()=>{if(!file||b.classList.contains('loading'))return;b.disabled=true;b.classList.add('loading');b.textContent='正在推演天机...';s.textContent='';e.textContent='';r.hidden=true;r.innerHTML='';try{render(await requestAnalysis(file));s.textContent='长卷已成'}catch(error){console.error('手相解析请求失败:',error);e.textContent='天机受阻，请稍后再试'}finally{b.disabled=false;b.classList.remove('loading');b.textContent='开卷观相'}};
</script></body></html>

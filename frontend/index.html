<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三才纹 · 相理雅玩</title>
<style>
:root{--paper:#f4eedf;--paper2:#fbf7ed;--ink:#211e1a;--vermilion:#9d3030;--blue:#56707b;--muted:#8b8274}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#d8cdb8;color:var(--ink);font-family:Georgia,"Noto Serif SC",serif}main{width:min(980px,calc(100% - 28px));margin:36px auto 60px}.title{text-align:center;letter-spacing:.42em;color:var(--blue);font-size:12px}.intro{text-align:center;margin:18px 0 30px}.intro h1{font-size:clamp(34px,8vw,64px);font-weight:500;margin:0;color:var(--vermilion)}.intro p{color:#726957}.panel{background:var(--paper);padding:28px;border:1px solid #b7a98e;box-shadow:8px 10px 0 rgba(77,56,31,.12);position:relative}.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(157,48,48,.25);pointer-events:none}.upload{text-align:center;position:relative;z-index:1}.drop{display:block;padding:25px;border:1px dashed #9d3030;color:#726957;cursor:pointer}.drop input{display:none}.preview{max-width:100%;max-height:350px;margin:18px auto;display:block}.btn{background:var(--vermilion);color:#fff;border:0;padding:11px 26px;font-family:inherit;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.loading:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{color:#726957;min-height:22px}.error{color:var(--vermilion);font-family:inherit;min-height:22px}.report{margin-top:26px}.seal{width:min(90%,620px);margin:0 auto 30px;text-align:center;color:var(--vermilion);border:3px double var(--vermilion);padding:18px;box-shadow:4px 4px 0 var(--vermilion)}.seal h2{margin:0;font-size:clamp(28px,6vw,52px);font-weight:500}.seal small{letter-spacing:.4em}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;position:relative}.card{grid-column:span 2;background:var(--paper2);border:1px solid rgba(47,41,34,.25);padding:20px;box-shadow:inset 0 0 35px rgba(80,60,35,.07)}.card:nth-child(4){grid-column:2 / span 2}.card:nth-child(5){grid-column:4 / span 2}.card h3{color:var(--vermilion);font-weight:500}.card p{line-height:2;color:#39332b}.trace{margin-top:26px;border-left:2px solid var(--vermilion);padding-left:16px;color:#655d51;line-height:2}.trace summary{cursor:pointer;color:var(--blue)}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:30px}@media(max-width:700px){.cards{grid-template-columns:1fr}.card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}.panel{padding:20px}}
</style></head><body><main><div class="title">观掌 · 观势 · 观心</div><header class="intro"><h1>三才纹</h1><p>以掌中纹理，寻东方相理之微言</p></header><section class="panel"><div class="upload"><label class="drop">请将掌心照片置于此处<br><small>支持 JPG / PNG，建议自然光、掌面完整</small><input id="file" type="file" accept="image/jpeg,image/png"></label><img id="preview" class="preview" hidden><button id="go" class="btn" disabled>开卷观相</button><p id="status" class="status"></p><p id="error" class="error" role="alert"></p></div><section id="report" class="report" hidden></section></section></main>
<script>
const f=document.querySelector('#file'),p=document.querySelector('#preview'),b=document.querySelector('#go'),s=document.querySelector('#status'),e=document.querySelector('#error'),r=document.querySelector('#report');let file;
f.onchange=()=>{file=f.files[0];if(!file)return;p.src=URL.createObjectURL(file);p.hidden=false;b.disabled=false;e.textContent='';r.hidden=true;r.innerHTML=''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function complete(j){return Boolean(j?.master_pan_ci&&j?.analysis?.foundation&&j?.analysis?.wisdom&&j?.analysis?.karma&&j?.analysis?.career&&j?.analysis?.marriage&&j?.observations?.earth_line&&j?.observations?.human_line&&j?.observations?.heaven_line&&j?.observations?.jade_pillar_line&&j?.observations?.family_ethos_line)}
function render(j){if(!complete(j))throw new Error('后端返回字段不完整');const a=j?.analysis||{},o=j?.observations||{};r.innerHTML='<div class="seal"><h2>'+esc(j?.master_pan_ci||'潜龙在渊，静待时飞')+'</h2><small>五纹批语</small></div><div class="cards"><article class="card"><h3>根基 · 地纹</h3><p>'+esc(a?.foundation||'暂无释义')+'</p></article><article class="card"><h3>心智 · 人纹</h3><p>'+esc(a?.wisdom||'暂无释义')+'</p></article><article class="card"><h3>因缘 · 天纹</h3><p>'+esc(a?.karma||'暂无释义')+'</p></article><article class="card"><h3>基业 · 玉柱纹</h3><p>'+esc(a?.career||'暂无释义')+'</p></article><article class="card"><h3>姻缘 · 家风纹</h3><p>'+esc(a?.marriage||'暂无释义')+'</p></article></div><details class="trace"><summary>观相明细 · 探源相理依据</summary><p><b>地纹：</b>'+esc(o?.earth_line||'暂无观测')+'</p><p><b>人纹：</b>'+esc(o?.human_line||'暂无观测')+'</p><p><b>天纹：</b>'+esc(o?.heaven_line||'暂无观测')+'</p><p><b>玉柱纹：</b>'+esc(o?.jade_pillar_line||'暂无观测')+'</p><p><b>家风纹：</b>'+esc(o?.family_ethos_line||'暂无观测')+'</p></details><p class="note">'+esc(j?.disclaimer||'本卷轴由 AI 结合传统易理相学生成，仅供国学文化交流与雅玩，不作现代医学或人生决策之用。')+'</p>';r.hidden=false}
async function requestAnalysis(selectedFile){const fd=new FormData();fd.append('image',selectedFile);const response=await fetch('/api/v1/palmistry/analyze',{method:'POST',body:fd});const raw=await response.text();let responseData;try{responseData=raw?JSON.parse(raw):{}}catch{responseData=raw}console.log('后端返回的原始数据:',responseData);if(!response.ok){throw new Error(responseData?.detail?.error?.message||responseData?.error?.message||'天机受阻，请稍后再试')}return responseData}
b.onclick=async()=>{if(!file||b.classList.contains('loading'))return;b.disabled=true;b.classList.add('loading');b.textContent='正在推演天机...';s.textContent='';e.textContent='';r.hidden=true;r.innerHTML='';try{const resultData=await requestAnalysis(file);render(resultData);s.textContent='相理已成卷'}catch(error){console.error('手相解析请求失败:',error);e.textContent='天机受阻，请稍后再试'}finally{b.disabled=false;b.classList.remove('loading');b.textContent='开卷观相'}};
</script></body></html>
